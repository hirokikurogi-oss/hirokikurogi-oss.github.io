<!doctype html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- if page.title %}
<title>{{ page.title }} | {{ site.title }}</title>
{%- else %}
<title>{{ site.title }} | 黒木 広季</title>
{%- endif %}
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/logo/icon-512.png' | absolute_url }}">
<link rel="icon" href="{{ '/assets/logo/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/assets/logo/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ '/assets/logo/apple-touch-icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">本文へ移動</a>
<div class="wrap">
{% include header.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
</div>
</body>
</html>
