# 業務実績（社名・製品名は伏せる）
- meta: 2022–2026 ／ PL ／ 体制35名
  title: カメラと連携する toC スマホアプリ
  problem: v1.0 の立ち上げ。技術選定と、チームで共有するコーディングの基準づくりから必要だった
  action: Android 版の技術選定を調査し、Kotlin / Jetpack Compose のコーディング規約のベースを作成。顧客とのやり取りとメンバーのフォローをしながら、自分でも実装
  result: 約4年で v3.0 まで継続してリリース。Android 11〜16、iOS 13〜18 の OS アップデートにも対応

- meta: 2021–2022 ／ PL（途中参画）／ 体制9名
  title: 遅れていた組み込み系 Web システムの立て直し
  problem: カメラに接続するパーツ内で動く Web システムの開発が、計画から遅れていた
  action: 途中から PL として参画。現状を把握して計画とのズレを洗い出し、社内外と交渉
  result: 最終の納期までに完了

- meta: 2015–2018 ／ 技術移管〜保守 ／ 体制約7名
  title: 既存システムの技術移管とチームづくり
  problem: 他社が作ったスキャンデータ管理システムを、社内で引き取る必要があった
  action: 技術移管に1人で臨み、仕様を整理して社内のチーム体制を構築。新人教育と社内セミナーの講師も担当
  result: 約3年にわたって保守と機能拡張を継続。連携ツールの案件を複数の契約につなげた
